services:
  postgres:
    image: postgis/postgis:14-3.4
    environment:
      POSTGRES_USER: smartwaste
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: smartwaste_demo
    volumes: [postgres_demo:/var/lib/postgresql/data]
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartwaste -d smartwaste_demo"]
      interval: 10s
      timeout: 5s
      retries: 10
  api:
    build: .
    environment:
      APP_ENV: demo
      DATABASE_URL: postgresql://smartwaste:${POSTGRES_PASSWORD}@postgres:5432/smartwaste_demo
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?required}
      MEDIA_STORAGE_PATH: /app/var/private_media
      HTTPS_ENABLED: "true"
      CORS_ORIGINS: ${PUBLIC_ORIGIN:?required}
      WEBSOCKET_ORIGINS: ${PUBLIC_ORIGIN:?required}
      LOG_FORMAT: json
      SMARTWASTE_DISABLE_AI: "true"
    volumes: [private_media:/app/var/private_media]
    networks: [internal, edge]
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped
  automation:
    build: .
    command: ["python", "run_automation.py", "--worker"]
    environment:
      APP_ENV: demo
      DATABASE_URL: postgresql://smartwaste:${POSTGRES_PASSWORD}@postgres:5432/smartwaste_demo
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?required}
      MEDIA_STORAGE_PATH: /app/var/private_media
      HTTPS_ENABLED: "true"
      CORS_ORIGINS: ${PUBLIC_ORIGIN:?required}
      WEBSOCKET_ORIGINS: ${PUBLIC_ORIGIN:?required}
      SMARTWASTE_DISABLE_AI: "true"
      AUTOMATION_INTERVAL_SECONDS: ${AUTOMATION_INTERVAL_SECONDS:-300}
    volumes: [private_media:/app/var/private_media]
    networks: [internal]
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped
  proxy:
    image: nginx:1.27-alpine
    volumes: [./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro]
    ports: ["8080:80"]
    networks: [edge]
    depends_on: [api]
volumes:
  postgres_demo:
  private_media:
networks:
  internal: {internal: true}
  edge:
